<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка зимнего похода</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* VOICE: рабочий пульт команды продаж и маркетинга — спокойно, плотно, по делу
   IDEA: карта похода, где видно, кто на какой стоянке и кто отстал
   PICTURE: маршрут-воронка из стоянок с числом людей и потерями между ними
   COLOUR and TYPE: ночь мини-аппа #0f1c33, снег, розовые плашки, жёлтые кнопки; IBM Plex Mono для заголовков и цифр, Inter для текста
   LAYOUT: шапка с разделами, первый экран — главные цифры и маршрут; на телефоне разделы внизу */
:root{color-scheme:dark;--night:#0f1c33;--night2:#16284a;--night3:#1d3360;--line:#2a4170;--snow:#f4f7fb;--dim:#b4c2d8;--mute:#8396b5;--beige:#efe8da;--rose:#f4b5d4;--rosed:#a8447a;--yellow:#efdb55;--pine:#8fb35a;--red:#ef7a6a;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--f:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--night);color:var(--snow);font:15px/1.5 var(--f);overflow-x:clip}
a{color:var(--yellow)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:rgba(15,28,51,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px max(3vw,14px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:600;text-transform:uppercase;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.upd{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:13px}
.upd button{background:var(--night2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px}
.brand small{display:block;font-family:var(--f);text-transform:none;font-weight:400;font-size:12.5px;color:var(--dim);letter-spacing:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{text-decoration:none;color:var(--dim);padding:9px 13px;border-radius:999px;font-weight:500;min-height:40px;display:inline-flex;align-items:center}
.tabs a.on{background:var(--rose);color:#23262d}
.demo{background:var(--yellow);color:#23262d;font-size:13px;text-align:center;padding:6px 12px;font-weight:500}
main{max-width:1240px;margin:0 auto;padding:22px max(3vw,14px) 60px}
h1{font-family:var(--mono);font-weight:600;text-transform:uppercase;font-size:clamp(24px,3.4vw,36px);line-height:1.08;letter-spacing:-.02em;margin:4px 0 6px;text-wrap:balance}
.lead{color:var(--dim);margin:0 0 20px;max-width:70ch}
h2{font-family:var(--mono);font-weight:600;text-transform:uppercase;font-size:17px;letter-spacing:-.01em;margin:0 0 4px}
.hint{color:var(--mute);font-size:13.5px;margin:0 0 14px}
.card{background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-family:var(--mono);font-size:clamp(22px,2.6vw,30px);font-weight:600;line-height:1.1}
.kpi span{color:var(--dim);font-size:13px}
.kpi.hot{background:var(--rose);color:#23262d;border-color:var(--rose)}.kpi.hot span{color:#4a3340}
/* маршрут-воронка */
.route{display:grid;gap:6px}
.st{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 5.5em 5em;gap:10px;align-items:center;padding:4px 0}
.st .n{font-size:14px}
.st .n small{display:block;color:var(--mute);font-size:12px}
.bar{height:22px;background:var(--night);border-radius:6px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--yellow),#f3e58a);border-radius:6px}
.bar.r i{background:linear-gradient(90deg,var(--rose),#f8cfe2)}
.st .v{font-family:var(--mono);text-align:right;white-space:nowrap}
.st .loss{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--mute);white-space:nowrap}
.st .loss.big{color:var(--red);font-weight:600}
.ins{display:grid;gap:10px}
.in{background:var(--night);border-left:3px solid var(--yellow);border-radius:8px;padding:10px 12px}
.in.r{border-color:var(--red)}.in.g{border-color:var(--pine)}
.in b{display:block;margin-bottom:2px}
.in span{color:var(--dim);font-size:13.5px}
/* таблицы */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12.5px;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid rgba(42,65,112,.6);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(244,181,212,.06)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-hot{background:var(--rose);color:#23262d}.t-warm{background:var(--yellow);color:#23262d}.t-cold{background:var(--night3);color:var(--dim)}
.crm-y{color:var(--pine);font-size:12.5px;white-space:nowrap}.crm-n{color:var(--mute);font-size:12.5px;white-space:nowrap}
.who b{display:block}.who span{color:var(--mute);font-size:12.5px}
.stuck{color:var(--red);font-size:12.5px;display:block}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters input,.filters select{background:var(--night);border:1px solid var(--line);color:var(--snow);border-radius:10px;padding:9px 11px;font:16px var(--f);min-height:44px}
.filters input{flex:1 1 220px}
.chip{background:var(--night);border:1px solid var(--line);border-radius:999px;padding:8px 13px;min-height:40px;font-size:14px}
.chip.on{background:var(--rose);color:#23262d;border-color:var(--rose)}
.btn{text-decoration:none;display:inline-flex;align-items:center;background:var(--yellow);color:#23262d;border:0;border-radius:999px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.g{background:transparent;color:var(--snow);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.more{display:flex;justify-content:center;margin-top:14px}
/* сегменты */
.segs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.seg{background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;align-content:start}
.seg-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.seg-h b{font-size:16px}
.seg-h .c{font-family:var(--mono);font-size:26px;font-weight:600;white-space:nowrap}
.seg p{margin:0;color:var(--dim);font-size:14px}
.seg .do{background:var(--night);border-radius:10px;padding:9px 11px;font-size:13.5px}
.seg .do b{color:var(--yellow);font-weight:600}
.tag{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;background:var(--rose);color:#23262d;padding:1px 7px;justify-self:start}
.tag.y{background:var(--yellow)}
/* задачи */
.tk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,9em) 3.5em;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.tk .bar{height:14px}
.tk.worst .bar i{background:var(--red)}
.tk .v{font-family:var(--mono);text-align:right}
.dayh{font-family:var(--mono);font-size:13px;text-transform:uppercase;color:var(--rose);margin:14px 0 4px}
.dayh:first-child{margin-top:0}
.hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;align-items:end;height:130px}
.hours i{display:block;background:var(--yellow);border-radius:3px 3px 0 0;min-height:2px}
.hours i.pk{background:var(--rose)}
.hl{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px}
.hl span{text-align:center}
/* карточка участницы */
.shade{position:fixed;inset:0;background:rgba(5,10,20,.6);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--night2);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:18px 18px 40px}
.open .shade{display:block}.open .drawer{transform:none}
.dr-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dr-h h3{margin:0;font-family:var(--mono);text-transform:uppercase;font-size:22px;line-height:1.1}
.x{background:var(--night);border:1px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;flex:none}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.facts div{background:var(--night);border-radius:10px;padding:9px 11px;font-size:13.5px}
.facts div span{display:block;color:var(--mute);font-size:12px}
.facts div span.pill{display:inline-block;color:#23262d}.facts div span.nx{color:var(--yellow);font-size:13.5px}.facts div span.nx.late{color:var(--red)}
.dr-s{margin-top:16px}
.dr-s h4{font-family:var(--mono);text-transform:uppercase;font-size:13px;color:var(--rose);margin:0 0 6px}
.ans{background:var(--beige);color:#2b2620;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:6px}
.ans span{display:block;font-size:12px;color:#8a7f69}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:4px 0 8px 14px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--yellow)}
.tl li.m::before{background:var(--rose)}
.tl li span{color:var(--mute);font-family:var(--mono);font-size:12px;margin-right:6px}
.days5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.days5 div{background:var(--night);border-radius:8px;padding:6px;text-align:center;font-size:12px;color:var(--mute)}
.days5 div b{display:block;font-family:var(--mono);font-size:14px;color:var(--snow)}
.days5 div.ok{background:rgba(143,179,90,.18)}.days5 div.ok b{color:var(--pine)}
.days5 div.stop{outline:2px solid var(--red)}
.score{display:grid;gap:3px;font-size:13.5px}
.score div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
.score div b{font-family:var(--mono)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.f2 select,.f2 textarea{width:100%;background:var(--night);border:1px solid var(--line);color:var(--snow);border-radius:10px;padding:9px 11px;font:16px var(--f);min-height:44px}
.f2 textarea{grid-column:1/-1;min-height:70px;resize:vertical}
.toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);background:var(--snow);color:#23262d;padding:10px 16px;border-radius:999px;font-weight:500;z-index:60;transition:transform .2s;max-width:92vw;text-align:center}
.toast.on{transform:translateX(-50%);visibility:visible}
.list{margin:0;padding-left:20px}.list li{margin:4px 0}
.scroll{overflow-x:auto}
code{font-family:var(--mono);font-size:13px;background:var(--night);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
/* динамика по дням */
.dyn-w{overflow-x:auto;padding-bottom:4px}
.dyn{display:flex;gap:6px;align-items:flex-end;min-height:170px;min-width:100%}
.dc{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dc .bs{display:flex;gap:2px;align-items:flex-end;height:140px;width:100%;justify-content:center}
.dc .bs i{display:block;width:30%;max-width:12px;border-radius:3px 3px 0 0}
.dc span{font-family:var(--mono);font-size:10.5px;color:var(--mute);white-space:nowrap}
.dc.td span{color:var(--snow);font-weight:600}
.s1{background:var(--yellow)}.s2{background:var(--rose)}.s3{background:var(--pine)}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--dim);margin:10px 0 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tvy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tvy div{background:var(--night);border-radius:10px;padding:10px 12px}
.tvy b{display:block;font-family:var(--mono);font-size:22px;line-height:1.15}
.tvy span{color:var(--mute);font-size:12.5px;display:block}
.up{color:var(--pine)}.dn{color:var(--red)}
/* лиды: выбор и план */
td.ck,th.ck{width:34px;padding-inline:4px}
.ck input,#selall{width:22px;height:22px;accent-color:var(--rose);margin:0}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--night3);border:1px solid var(--rose);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.selbar select{background:var(--night);border:1px solid var(--line);color:var(--snow);border-radius:10px;padding:7px 10px;font:16px var(--f);min-height:40px}
.hotago{display:block;color:var(--rose);font-size:12px;font-family:var(--f);white-space:nowrap}
.nx{display:block;font-size:12.5px;color:var(--yellow);white-space:nowrap}.nx.late{color:var(--red)}
.f2 label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.f2 input[type=date]{width:100%;background:var(--night);border:1px solid var(--line);color:var(--snow);border-radius:10px;padding:9px 11px;font:16px var(--f);min-height:44px;color-scheme:dark}
/* к эфиру */
.q{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid rgba(42,65,112,.6)}
.q:last-child{border-bottom:0}
.q .qn{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--yellow);text-align:right}
.q p{margin:0 0 3px}
.lnk{background:none;border:0;padding:0;color:var(--dim);font:inherit;font-size:13px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.who-l{color:var(--mute);font-size:13px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.vid{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;align-content:start}
.vid.on{border-color:var(--rose);box-shadow:inset 0 0 0 1px var(--rose)}
.vid .nm{font-weight:600;text-align:left;color:var(--snow);font-size:15px;text-decoration:none}
.vid .id{font-size:13.5px;color:var(--dim);margin:0}
.vid a.op{overflow-wrap:anywhere;font-size:13.5px}
.ideas{display:grid;gap:6px}
.ideas div{background:var(--night);border-radius:10px;padding:9px 11px;font-size:14px}
.ideas div .lnk{display:block;margin-top:2px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:first-child{grid-column:1/-1}.grid,.segs{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){
 .top{backdrop-filter:none;background:var(--night)}
 .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
 .tabs a{padding:8px 11px;font-size:14px;flex:none}
 .st{grid-template-columns:minmax(0,1fr) 4.5em;row-gap:4px}.st .bar{grid-column:1/-1;grid-row:2}.st .loss{grid-column:1/-1;text-align:left}
 .facts{grid-template-columns:minmax(0,1fr)}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute);font-size:12px;white-space:normal}.stack td:empty{display:none}
 .hl span:nth-child(odd){visibility:hidden}
 .stack tr{position:relative}.stack td.ck{position:absolute;right:0;top:10px;padding:0;width:auto}.stack td.ck::before{display:none}.stack td.who{padding-inline-end:36px}
 .filters select{flex:1 1 calc(50% - 4px);min-width:0}
 .tvy{grid-template-columns:minmax(0,1fr)}.tvy div{display:flex;align-items:baseline;gap:10px}.tvy b{font-size:20px;min-width:2.2em}
}
@media (prefers-reduced-motion:reduce){.drawer,.toast{transition:none}}
</style>
</head>

<script>
{
/* ===== справочники из мини-аппа (index.html: DAYS, TASKS) ===== */
const DAYS=[["Сборы","02.12"],["В путь","03.12"],["Привал","04.12"],["Ночёвка","05.12"],["У костра","06.12"]];

 ["Посмотреть урок 1","Записать идею своего ролика","Составить список кадров","Собрать 3–5 референсов","Снять первые кадры"],
 ["Посмотреть урок 2","Отобрать лучшие кадры","Продумать структуру","Выбрать музыку","Собрать черновой монтаж"],
 ["Пересмотреть черновик","Доснять недостающие кадры","Доработать монтаж","Сохранить финал и вставить ссылку","Освободить вечер под эфир","Написать письмо себе"],
 ["Подготовить ссылку на ролик","Записать вопросы к эфиру","Прийти на эфир у костра","Записать, что забираю с собой"]];
const STK=["new","contacted","thinking","bought","refused"], STL=["Новый","Связались","Думает","Купила","Отказ"];
const MAN=["—","Софья","Менеджер 2","Менеджер 3"];
const API='https://wrhkgedbwgdjzcjtctcy.supabase.co/functions/v1/hike?admin';
const DEMO=/[?&]demo=1/.test(location.search);
const W=window.Telegram&&window.Telegram.WebApp;
const INIT=(W&&W.initData)||'';
try{ W&&W.ready&&W.ready(); W&&W.expand&&W.expand(); }catch(e){}

let CH_KNOWN=false, L=[], ALL=[], NOW=Date.now(), HOURS=Array(24).fill(0), SRC=[], FUN=[], SEGS=[], N=0, LOADED='', SHOW_TEAM=false, DAILY={};

/* дата по Берлину в виде ГГГГ-ММ-ДД */
const BD=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'});

  [['channel','Открыла ссылку на канал'],['remind','Поставила напоминание об эфире'],['l1','Открыла урок 1'],['l2','Открыла урок 2'],['live','Перешла в эфир'],['claim','Забрала пропуск',1],['exp','Нажала «Узнать про экспедицию»',1]].forEach(([k,x,m])=>{ if(p.at&&p.at[k]) tl.push([p.at[k],x,m]); });
  if(p.opened) tl.push([p.last,'Последний раз в мини-аппе · заходила '+p.opens+' раз']);
  return `<div class="dr-h"><div><h3>${esc(p.name)}</h3><span class="hint">${p.user?'@'+esc(p.user)+' · ':''}${esc(p.phone||'телефона нет')}</span></div><button class="x" id="close" aria-label="Закрыть">✕</button></div>
  <div class="row" style="margin-top:10px">${p.user?`<a class="btn sm" href="https://t.me/${encodeURIComponent(p.user)}" target="_blank" rel="noopener">Написать в Telegram</a>`:''}${p.phone?`<button class="btn sm g" data-cp="${esc(p.phone)}">Скопировать телефон</button>`:''}</div>
  <div class="facts"><div><span>Этап</span>${esc(stage(p))}</div><div><span>Баллы</span>${p.score} · <span class="pill t-${p.temp}" style="display:inline-block">${TT[p.temp]}</span></div><div><span>Источник</span>${esc(p.src)}</div><div><span>Была в сети</span>${ago(p.stuckH)}</div>${p.hotAt?`<div><span>Стала горячей</span>${ago(p.hotH)}</div>`:''}${p.next?`<div><span>Связаться</span>${nextTxt(p)}</div>`:''}<div style="grid-column:1/-1"><span>Канал похода</span>${p.inChannel===true?'в канале':p.inChannel===false?'<b style="color:var(--red)">не вступила</b>':'пока неизвестно'}</div>${s?`<div style="grid-column:1/-1"><span>Застряла</span><b style="color:var(--red)">${esc(s)}</b></div>`:''}</div>
  <div class="days5">${DAYS.map((d,i)=>{const t=p.tasks[i],n=t.filter(Boolean).length,all=n===t.length;return `<div class="${all?'ok':''}${p.day===i&&!all&&s?' stop':''}">${d[0]}<b>${n?n+'/'+t.length:'—'}</b></div>`}).join('')}</div>
  <div class="dr-s"><h4>Ответы</h4>${p.idea?`<div class="ans"><span>идея ролика</span>${esc(p.idea)}</div>`:''}${p.video?`<div class="ans"><span>ссылка на ролик</span>${esc(p.video)}</div>`:''}${p.qs.map(q=>`<div class="ans"><span>вопрос к эфиру</span>${esc(q)}</div>`).join('')}${!p.idea&&!p.video&&!p.qs.length?'<p class="hint">Пока нет ответов.</p>':''}</div>
  <div class="dr-s"><h4>Работа продаж</h4><div class="f2"><select id="cst" aria-label="Статус">${STL.map((t,i)=>`<option value="${i}"${p.st===i?' selected':''}>${t}</option>`).join('')}</select><select id="cman" aria-label="Менеджер">${(MAN.includes(p.man)?MAN:MAN.concat([p.man])).map(m=>`<option${p.man===m?' selected':''}>${esc(m)}</option>`).join('')}</select><label style="grid-column:1/-1">Когда связаться в следующий раз<input type="date" id="cnext" value="${esc(p.next)}"></label><textarea id="cnote" placeholder="Заметка к звонку">${esc(p.note)}</textarea></div>
   <div class="row" style="margin-top:8px"><button class="btn sm" id="csave">Сохранить</button><button class="btn sm g" data-crm="one">${p.crm?'Отправить в CRM ещё раз':'Отправить в CRM'}</button>${p.crm?`<span class="crm-y">в CRM${p.deal?' · сделка '+esc(p.deal):''}</span>`:''}</div></div>
  <div class="dr-s"><h4>История</h4><ul class="tl">${tl.sort((a,b)=>a[0]-b[0]).map(([t,x,m])=>`<li class="${m?'m':''}"><span>${dt(t)}</span>${esc(x)}</li>`).join('')}</ul></div>
  <div class="dr-s"><h4>Из чего баллы</h4><div class="score">${PTS.filter(([,,f])=>pv(f,p)).map(([t,v,f])=>`<div><span>${esc(t)}</span><b>+${v*pv(f,p)}</b></div>`).join('')||'<p class="hint">Пока ноль.</p>'}</div></div>`;
}
let cur=null;
function openCard(id){cur=ALL.find(p=>String(p.id)===String(id));if(!cur)return;document.getElementById('drawer').innerHTML=card(cur);const d=document.getElementById('dr');d.className='open';d.setAttribute('aria-hidden','false');document.getElementById('close').focus()}
function closeCard(){const d=document.getElementById('dr');d.className='';d.setAttribute('aria-hidden','true')}
function refresh(){const r=document.getElementById('lres');if(r){r.innerHTML=lidyRes();lab(r)}else route()}
let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function copy(txt,msg){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(msg),()=>toast('Не получилось скопировать'))}
function msg(title,text){V.innerHTML=`<section class="card" style="max-width:640px;margin:40px auto"><h2>${esc(title)}</h2><p>${text}</p></section>`}

function crmComment(p){
  return ['Зимний поход (мини-апп)','Этап: '+stage(p),stuck(p)?'Застряла: '+stuck(p):'','Баллы: '+p.score+' ('+TT[p.temp]+')','Была в сети: '+ago(p.stuckH),
    p.idea?'Идея ролика: '+p.idea:'',p.video?'Ролик: '+p.video:'',p.qs.length?'Вопросы к эфиру: '+p.qs.join(' | '):'',
    p.st?'Статус в админке: '+STL[p.st]:'',p.man!=='—'?'Менеджер: '+p.man:'',p.next?'Связаться: '+dm(p.next):'',p.note?'Заметка: '+p.note:''].filter(Boolean).join('\n');
}
async function sendCRM(list,btn){
  let ok=0,bad=0; const errs={};
  for(let i=0;i<list.length;i+=40){
    const part=list.slice(i,i+40);
    if(btn) btn.textContent='Отправляю '+Math.min(i+40,list.length)+' из '+list.length+'…';
    if(DEMO){ part.forEach(p=>{p.crm=true}); ok+=part.length; continue; }
    try{
      const {j}=await api({op:'crm',leads:part.map(p=>({tg_id:p.id,comment:crmComment(p),tags:['зимний поход',TT[p.temp]].join(', ')}))});
      if(!j.ok){ bad+=part.length; continue; }
      j.results.forEach(r=>{ const p=ALL.find(x=>String(x.id)===String(r.tg_id)); if(r.ok&&p){ p.crm=true; p.deal=r.deal||''; ok++; } else { bad++; errs[r.error||'ошибка']=(errs[r.error||'ошибка']||0)+1; } });
    }catch(e){ bad+=part.length; errs['нет связи']=(errs['нет связи']||0)+part.length; }
  }
  toast(DEMO?'Демо: отмечено как отправленные — '+ok:('В CRM ушло: '+ok+(bad?' · не ушло: '+bad+' ('+Object.entries(errs).map(([k,v])=>k+' — '+v).join(', ')+')':'')));
  build(); route(); if(cur&&document.getElementById('dr').className==='open') openCard(cur.id);
}
const VIEWS={obzor:vObzor,lidy:vLidy,segmenty:vSeg,efir:vEfir,marketing:vMarketing,dannye:vData};
function route(){ if(!ALL.length&&!LOADED) return; const h=location.hash.replace('#','');const k=VIEWS[h]?h:'obzor';V.innerHTML=VIEWS[k]();lab(V);const dw=V.querySelector('.dyn-w');if(dw)dw.scrollLeft=dw.scrollWidth;document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+k))}
window.addEventListener('hashchange',()=>{closeCard();route();window.scrollTo(0,0)});
async function api(body){ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({initData:INIT},body))}); let j={}; try{ j=await r.json(); }catch(e){} return {status:r.status,j}; }
async function load(){
  if(DEMO){ ALL=demo(); LOADED='демо'; document.getElementById('upd').textContent='демо-данные'; document.getElementById('demo').hidden=false; build(); route(); return; }
  if(!INIT){ msg('Откройте админку в Telegram','Админка работает только внутри Telegram: откройте мини-апп «Зимний поход» в боте и нажмите внизу «админка». Посмотреть, как она выглядит, можно <a href="?demo=1">на демо-данных</a>.'); return; }
  document.getElementById('upd').textContent='загружаю…';
  try{
    const {status,j}=await api({op:'data'});
    if(status===401){ msg('Нужно открыть заново','Telegram не подтвердил вход или ссылка устарела. Закройте мини-апп и откройте его снова из бота.'); return; }
    if(status===403){ msg('Нет доступа','Админка открывается только аккаунтам команды. Если вы из команды, попросите отметить вас админом.'); return; }
    if(!j.ok){ msg('Не загрузилось','Сервер не ответил. Попробуйте обновить через минуту.'); return; }
    ALL=fromLive(j.data); LOADED=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('upd').textContent='обновлено в '+LOADED; build(); route();
  }catch(e){ msg('Нет связи','Проверьте интернет и обновите страницу.'); }
}
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.id==='reload'){ load(); return; }
  const ext=t.closest('a[data-ext]');if(ext&&W&&W.openLink){e.preventDefault();try{W.openLink(ext.href)}catch(err){window.open(ext.href,'_blank','noopener')}return}
  const ckc=t.closest('td.ck,th.ck');if(ckc){ if(t.tagName!=='INPUT'){const i=ckc.querySelector('input');if(i)i.click();} return; }
  const row=t.closest('tr.click');if(row){openCard(row.dataset.id);return}
  const op=t.closest('[data-open]');if(op){openCard(op.dataset.open);return}
  if(t.closest('[data-plan]')){LF={...LF,plan:true,seg:'',lim:40};location.hash='lidy';route();return}
  if(t.id==='fplan'){LF.plan=!LF.plan;refresh();return}
  if(t.id==='selallb'){filtered().forEach(p=>SEL.add(String(p.id)));refresh();return}
  if(t.id==='bclear'){SEL.clear();refresh();return}
  if(t.id==='bassign'){
    const v=document.getElementById('bman').value, man=v||'—', ids=[...SEL];
    if(!ids.length) return;
    const apply=()=>{ALL.forEach(p=>{if(SEL.has(String(p.id)))p.man=man});SEL.clear();build();route()};
    if(DEMO){ apply(); toast('Демо: назначено '+fmt(ids.length)); return; }
    t.disabled=true; t.textContent='Сохраняю…';
    try{ let ok=true; for(let i=0;i<ids.length;i+=2000){ const {j}=await api({op:'assign',tg_ids:ids.slice(i,i+2000).map(Number),manager:man==='—'?'':man}); if(!j.ok){ok=false;break} }
      if(ok){ const n=ids.length; apply(); toast((man==='—'?'Менеджер снят у ':'Назначено '+man+': ')+fmt(n)); } else { toast('Не сохранилось, попробуйте ещё раз'); t.disabled=false; t.textContent='Применить'; } }
    catch(err){ toast('Нет связи, не сохранилось'); t.disabled=false; t.textContent='Применить'; }
    return;
  }
  const pk=t.closest('[data-pick]');if(pk){
    const p=ALL.find(x=>String(x.id)===pk.dataset.pick); if(!p) return; const v=!p.pick;
    if(!DEMO){ pk.disabled=true; try{ const {j}=await api({op:'pick',tg_id:p.id,pick:v}); if(!j.ok){toast('Не сохранилось, попробуйте ещё раз');pk.disabled=false;return} }catch(err){toast('Нет связи, не сохранилось');pk.disabled=false;return} }
    p.pick=v; route(); toast(v?'Отмечено: разберём на эфире':'Отметка снята'); return;
  }
  if(t.id==='efpk'){EF.picked=!EF.picked;route();return}
  if(t.id==='vmore'){EF.vlim+=48;route();return}
  if(t.id==='imore'){EF.ilim+=60;route();return}
  const ec=t.closest('[data-efcopy]');if(ec){ const d=efirData();
    const txt=ec.dataset.efcopy==='qs'?d.qs.map(g=>g.who.length+' × '+g.t.replace(/\s+/g,' ')+' — '+g.who.map(p=>p.name).join(', ')).join('\n')
      :d.vids.filter(p=>p.pick).map(p=>[p.name,p.user?'@'+p.user:'',vurl(p.video)||p.video,p.idea].filter(Boolean).join(' — ')).join('\n');
    copy(txt,'Скопировано'); return; }
  if(t.closest('#close')||t.id==='shade'){closeCard();return}
  const sg=t.closest('[data-seg]');if(sg){LF={...LF,seg:sg.dataset.seg,lim:40};location.hash='lidy';route();return}
  const tp=t.closest('[data-temp]');if(tp){LF.temp=tp.dataset.temp;refresh();return}
  if(t.id==='fstk'){LF.stuckOnly=!LF.stuckOnly;refresh();return}
  if(t.id==='fseg'){LF.seg='';refresh();return}
  if(t.id==='more'){LF.lim+=60;refresh();return}
  if(t.id==='team'){SHOW_TEAM=!SHOW_TEAM;build();route();return}
  const cpp=t.closest('[data-cp]');if(cpp){copy(cpp.dataset.cp,'Телефон скопирован');return}
  if(t.id==='csave'&&cur){
    const st=+document.getElementById('cst').value, man=document.getElementById('cman').value, note=document.getElementById('cnote').value, next=document.getElementById('cnext').value||'';
    if(DEMO){ Object.assign(cur,{st,man,note,next,bought:st===3}); toast('Сохранено (демо)'); build(); route(); openCard(cur.id); return; }
    t.disabled=true; t.textContent='Сохраняю…';
    try{ const {j}=await api({op:'lead',tg_id:cur.id,status:STK[st],manager:man==='—'?'':man,note,next}); if(j.ok){ Object.assign(cur,{st,man,note,next,bought:st===3}); toast('Сохранено'); build(); route(); openCard(cur.id); } else toast('Не сохранилось, попробуйте ещё раз'); }
    catch(err){ toast('Нет связи, не сохранилось'); }
    t.disabled=false; t.textContent='Сохранить'; return;
  }
  const cr=t.closest('[data-crm]');if(cr){
    const k=cr.dataset.crm, list=k==='one'?(cur?[cur]:[]):(k==='list'?filtered():(SEGS.find(s=>s.id===k)||{list:[]}).list).filter(p=>!p.crm);
    if(!list.length){ toast('Все из этого списка уже в CRM'); return; }
    if(list.length>1&&!cr.classList.contains('armed')){ cr.classList.add('armed'); cr.dataset.txt=cr.textContent; cr.textContent='Точно отправить '+fmt(list.length)+'?'; setTimeout(()=>{ if(cr.isConnected){ cr.classList.remove('armed'); cr.textContent=cr.dataset.txt; } },4000); return; }
    cr.disabled=true; await sendCRM(list,cr); return;
  }
  const cp=t.closest('[data-copy]');if(cp){const k=cp.dataset.copy, list=k==='list'?filtered():(SEGS.find(s=>s.id===k)||{list:[]}).list;
    const txt=['Имя\tНик\tТелефон\tЭтап\tЗастряла\tБаллы\tТемпература\tИсточник\tИдея ролика\tСсылка на ролик\tВопросы к эфиру\tБыла в сети'].concat(list.map(p=>[p.name,p.user?'@'+p.user:'',p.phone,stage(p),stuck(p),p.score,TT[p.temp],p.src,p.idea,p.video,p.qs.join(' | '),ago(p.stuckH)].map(x=>String(x).replace(/[\t\n]/g,' ')).join('\t'))).join('\n');
    copy(txt,'Скопировано: '+fmt(list.length)+' строк — вставьте в таблицу или CRM');return}
});
let qt;document.addEventListener('input',e=>{if(e.target.id==='fq'){LF.q=e.target.value;LF.lim=40;clearTimeout(qt);qt=setTimeout(refresh,180)}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fst'){LF.stage=t.value;refresh()}if(t.id==='fsr'){LF.src=t.value;refresh()}
  if(t.id==='fman'){LF.man=t.value;lsSet('zp-admin-man',t.value);refresh()}
  if(t.id==='fso'){LF.sort=t.value;refresh()}
  if(t.dataset&&t.dataset.sel){t.checked?SEL.add(t.dataset.sel):SEL.delete(t.dataset.sel);refresh()}
  if(t.id==='selall'){const f=filtered();f.forEach(p=>t.checked?SEL.add(String(p.id)):SEL.delete(String(p.id)));refresh()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});
load();
}
</script>
