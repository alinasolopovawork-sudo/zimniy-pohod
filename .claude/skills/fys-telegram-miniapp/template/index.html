<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Зимний поход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: a winter hike in five stops. Night-mountain cover with falling snow, then the route (день 0 сборы → 1 в путь → 2 привал → 3 ночёвка → 4 у костра) as the navigation. Each day: a short poetic intro, the lesson or live card, then cream "paper" blocks the student fills in. Single theme by design: deep winter night, snow white, warm firelight. */
:root{
  --night:#0f1c33; --night-2:#16284a; --night-3:#203760;
  --paper:#f4f1ea; --paper-2:#e6e1d6; --ink:#1c2230; --muted:#5f6675; --line:#dad4c8;
  --snow:#f4f7fb; --snow-dim:#b4c2d8; --snow-line:rgba(244,247,251,.16); --snow-fill:rgba(244,247,251,.07);
  --ice:#9fc3ea; --ice-soft:#dbe9f8; --ice-ink:#24507e;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --beige:#efe8da; --yellow:#efdb55; --olive:#7a9440; --rose:#f4b5d4; --rose-deep:#a8447a; --rose-paper:rgba(251,231,235,.92); --fire:#efdb55; --fire-2:#e9773f; --fire-soft:#fbe5c4; --fire-ink:#8a4a10;
  --pine:#6f8c3e; --pine-soft:#e2ebd1; --pine-ink:#4b6328;
  --bad:#a63b2d;
  --r:14px;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-it:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--night)}
body{background-color:var(--night);background-image:radial-gradient(130% 70% at 50% 40%,transparent 55%,rgba(5,10,22,.45) 100%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .78  0 0 0 0 .74  0 0 0 0 .66  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");background-attachment:fixed,scroll;color:var(--snow);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0a1630}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fire);outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.it{font-family:var(--f-it);font-weight:400}

/* cover */
.cover{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#081329 0%,#13284d 50%,#284878 100%)}
.cover svg,.cover canvas,.cover .photo{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.cover canvas{z-index:0;pointer-events:none}
#land.fade{animation:landIn .7s ease}
/* phone: text on the night sky, the photo as a full-width band under it so the hikers and peaks stay in view */
@media (max-width:700px){
  .cover{background:linear-gradient(180deg,#09122a 0%,#0d1a36 100%)}
  .cover svg#land{top:auto;bottom:0;height:auto;aspect-ratio:1140/667;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%);mask-image:linear-gradient(180deg,transparent 0,#000 14%)}
  .cover .wrap{padding-block:44px calc(58.5vw - 30px)}
  nav.route{margin-top:-14px}
}
.moon-m{display:none;position:absolute;top:10px;right:max(14px,env(safe-area-inset-right,0px));width:64px;height:auto;z-index:0;pointer-events:none}
@media (max-width:700px){ .moon-m{display:block} }
@keyframes landIn{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ #land.fade{animation:none} }
.cover .paper{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 35%,transparent 55%,rgba(70,48,24,.38) 100%),linear-gradient(rgba(214,180,130,.07),rgba(214,180,130,.07))}
.cover .paper::after{content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .32  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>")}
.cover .photo{background-size:cover;background-position:center}
.cover .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,40,.35),rgba(10,20,40,.2) 45%,rgba(15,28,51,.95) 100%)}
.cover .wrap{position:relative;z-index:1;padding-block:96px 190px;display:grid;justify-items:center;text-align:center;gap:10px}
@media (max-width:720px){ .cover .wrap{padding-block:64px 130px} }
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--snow-dim)}
.cover h1{margin:0;font-family:var(--mono);font-weight:600;text-transform:uppercase;font-size:clamp(38px,7.4vw,92px);line-height:1.02;letter-spacing:-.03em}
.tframe{position:relative;display:grid;justify-items:center;gap:10px;padding:26px clamp(18px,4vw,48px) 24px;border:1.5px solid rgba(239,219,85,.85)}
.tframe::before{content:"";position:absolute;left:50%;top:-9px;width:1.5px;height:16px;background:var(--yellow);transform:translateX(-50%);box-shadow:0 calc(100% + 0px) 0 transparent}
.tframe::after{content:"";position:absolute;inset:0 -12px;background:linear-gradient(var(--yellow),var(--yellow)) left center/12px 1.5px no-repeat,linear-gradient(var(--yellow),var(--yellow)) right center/12px 1.5px no-repeat;pointer-events:none}
.cover .sub{font-family:var(--mono);text-transform:uppercase;font-size:clamp(12px,1.4vw,15px);letter-spacing:.04em;line-height:1.45;max-width:46ch;text-wrap:balance}
.cover .sub mark{background:var(--rose);color:#23262d;padding:1px 6px}
.cover h1,.cover .sub,.cover .who{text-shadow:0 2px 12px rgba(8,19,41,.45)}
.cover .who{margin-top:8px;font-size:14px;color:var(--snow-dim)}

/* route */
.route{position:relative;z-index:2;margin-top:-62px}
.stops{list-style:none;margin:0;padding:12px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;background:rgba(15,28,51,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--snow-line);border-radius:18px;position:relative}
.stop{border:0;background:transparent;color:var(--snow-dim);display:grid;justify-items:center;gap:6px;padding:10px 6px;border-radius:12px;text-align:center;width:100%;position:relative;z-index:1}
.stop:hover{background:var(--snow-fill);color:var(--snow)}
.stop .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--night-2);border:1.5px solid var(--snow-line);color:var(--snow);position:relative}
.stop .ic svg{width:26px;height:26px}
.stop .d{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.stop .n{font-size:16px;color:var(--snow)}
.stop[aria-current="step"] .ic{background:var(--rose);color:var(--ink);border-color:var(--rose)}
.stop[aria-current="step"] .n{color:var(--rose)}
.stop .ok{position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--pine);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid var(--night)}
.stops::before{content:"";position:absolute;left:8%;right:8%;top:48px;border-top:1.5px dashed rgba(244,247,251,.25);z-index:0}
@media (max-width:720px){
  .route{margin-top:-46px}
  .stops{display:flex;overflow-x:auto;scrollbar-width:none;padding:8px}
  .stops::-webkit-scrollbar{display:none}
  .stops::before{display:none}
  .stops li{flex:0 0 108px}
  .stop .ic{width:44px;height:44px}
}

main.wrap{padding-block:34px 40px}
.day-head{display:grid;gap:12px;max-width:760px;margin:6px 0 34px}
.day-head.bg{max-width:none;position:relative;isolation:isolate;padding:44px 40px 46px;border-radius:22px;overflow:hidden;min-height:320px;align-content:end}
.day-head.bg::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--dh-img) center 45%/cover no-repeat;filter:saturate(.8)}
.day-head.bg::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(15,28,51,.92) 0%,rgba(15,28,51,.7) 45%,rgba(15,28,51,.28) 100%),linear-gradient(0deg,rgba(15,28,51,.6),transparent 60%)}
.day-head.bg .intro{max-width:56ch}
@media (max-width:600px){ .day-head.bg{padding:30px 20px 28px;border-radius:18px;min-height:0} .day-head.bg::after{background:linear-gradient(180deg,rgba(15,28,51,.55),rgba(15,28,51,.88) 70%)} }
.day-head .k{justify-self:start;font-family:var(--mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#23262d;font-weight:500;background:var(--rose);padding:2px 7px}
.day-head h2{margin:0;font-family:var(--mono);font-weight:600;text-transform:uppercase;font-size:clamp(34px,5.4vw,54px);line-height:1.02;letter-spacing:-.03em;color:var(--snow)}
.day-head .intro{margin:0;font-family:var(--f);font-style:italic;font-size:clamp(17px,2vw,20px);line-height:1.45;color:#dfe6f2;text-wrap:pretty}

.lesson{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 20px;border-radius:var(--r);background:linear-gradient(120deg,rgba(60,100,160,.35),rgba(30,55,100,.15));border:1px solid var(--snow-line);margin-bottom:30px}
.lesson.fire{background:linear-gradient(120deg,rgba(233,119,63,.35),rgba(90,47,29,.1) 70%)}
.lesson .play{width:56px;height:56px;border-radius:50%;background:var(--snow);color:var(--ink);display:grid;place-items:center}
.lesson.fire .play{background:var(--fire)}
.lesson .play svg{width:22px;height:22px;margin-left:3px}
.lesson b{display:block;font-weight:400;font-size:20px}
.lesson span{color:var(--snow-dim);font-size:14px}
@media (max-width:600px){ .lesson{grid-template-columns:auto minmax(0,1fr)} .lesson .btn{grid-column:1/-1;justify-content:center} }

.btn{border:1px solid transparent;background:var(--ink);color:var(--snow);border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.18)}
.btn.fire{background:var(--fire);color:var(--ink)}
.btn.snow{background:var(--snow);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn.off{background:var(--snow-fill);color:var(--snow-dim);border-color:var(--snow-line);cursor:default}
.btn.danger{background:transparent;color:var(--bad);border-color:#e6c6bf}
.btn.danger.armed{background:var(--bad);color:#fff}

/* sections: written straight onto the night, no boxes */
.grid{display:grid;gap:16px}
.sec{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:14px 52px;padding:32px 34px;border-radius:22px;border:1px solid rgba(244,247,251,.07);background:linear-gradient(135deg,rgba(110,160,235,.13),rgba(110,160,235,.035) 70%)}
.grid>.sec:nth-child(3n+2){background:linear-gradient(135deg,rgba(150,128,240,.13),rgba(150,128,240,.03) 70%)}
.grid>.sec:nth-child(3n+3){background:linear-gradient(135deg,rgba(80,185,195,.12),rgba(80,185,195,.03) 70%)}
.sec.wide{grid-template-columns:1fr;gap:20px}
/* a photo on top of a section that melts into the section colour */
.sec-photo{grid-column:1/-1;height:340px;margin:-32px -34px 6px;border-radius:22px 22px 0 0;background-position:center 42%;background-size:cover;background-repeat:no-repeat;-webkit-mask-image:linear-gradient(180deg,#000 45%,rgba(0,0,0,.6) 70%,transparent 100%);mask-image:linear-gradient(180deg,#000 45%,rgba(0,0,0,.6) 70%,transparent 100%)}
@media (max-width:760px){ .sec-photo{height:230px;margin:-24px -18px 4px;border-radius:18px 18px 0 0} }
/* photo sections: darkened where the text is, clear mountains in the open space at the bottom */
.grid>.sec.ph{background-color:#0d1830;background-repeat:no-repeat;background-size:cover,cover;padding-bottom:190px;border-color:rgba(244,247,251,.1)}
.grid>.sec.ph-sunset{background-image:linear-gradient(180deg,rgba(9,16,32,.84) 0%,rgba(9,16,32,.72) 45%,rgba(9,16,32,.2) 72%,rgba(9,16,32,0) 100%),url("img/sunset.jpg");background-position:center,center 60%}
.grid>.sec.ph-night{background-image:linear-gradient(180deg,rgba(9,16,32,.82) 0%,rgba(9,16,32,.68) 45%,rgba(9,16,32,.15) 74%,rgba(9,16,32,0) 100%),url("img/night.jpg");background-position:center,center 52%}
@media (max-width:760px){ .grid>.sec.ph{padding-bottom:150px} }
.sec.wide .sec-h{grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:center}
.sec.wide .sec-h .ico{grid-row:span 2;margin:0}
@media (max-width:760px){ .sec{padding:24px 18px;border-radius:18px} }
@media (max-width:760px){ .sec{grid-template-columns:1fr;padding-block:28px} }
.sec-h{display:grid;gap:6px;align-content:start}
.sec-h .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--snow-line);color:var(--ice);margin-bottom:8px}
.sec-h .ico svg{width:20px;height:20px}
.sec-h h3{margin:0;font-family:var(--mono);font-weight:600;text-transform:uppercase;font-size:22px;letter-spacing:-.01em;line-height:1.2}
.sec-h p{margin:0;color:var(--snow-dim);font-size:14px;line-height:1.5;max-width:34ch}
.sec-b{display:grid;gap:26px;min-width:0;align-content:start}
.f{display:grid;gap:2px;min-width:0}
.f>label,.lbl{font-family:var(--f);font-size:17px;font-weight:500;line-height:1.35;letter-spacing:0;text-transform:none;color:var(--fire)}
.f input,.f textarea,.inp{width:100%;border:0;border-bottom:1px solid rgba(244,247,251,.22);border-radius:0;padding:9px 0;background:transparent;color:var(--snow);font-size:17px;line-height:1.5}
.f textarea{min-height:44px;resize:none;overflow:hidden;display:block}
.f input::placeholder,.f textarea::placeholder,.inp::placeholder,.ref .b input::placeholder{color:rgba(180,194,216,.62);font-style:italic;font-size:15px;line-height:1.45}
.f textarea.one{min-height:0}
@media (max-width:560px){ .f input::placeholder,.f textarea::placeholder,.inp::placeholder{font-size:14px}
  :is(.sec,.talk) .addrow,:is(.sec,.talk) .coloradd{flex-wrap:nowrap;gap:10px}
  :is(.sec,.talk) .addrow .btn.sm:not(.ghost),:is(.sec,.talk) .coloradd .btn.sm{font-size:0;padding:4px 2px;line-height:1}
  :is(.sec,.talk) .addrow .btn.sm:not(.ghost)::before,:is(.sec,.talk) .coloradd .btn.sm::before{content:"+";font-size:28px;font-weight:400;color:var(--fire)} }
.f input:focus,.f textarea:focus,.inp:focus{outline:none;border-bottom-color:var(--fire)}
.hint{font-size:14px;color:var(--snow-dim);margin:0}
.addrow{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.addrow .inp{flex:1 1 200px;min-width:0;font-size:17px}
:is(.sec,.talk) .btn.sm,:is(.sec,.talk) .btn.ghost{background:transparent;border:0;border-radius:0;padding:9px 0;color:var(--fire);font-size:15px;font-weight:700}
:is(.sec,.talk) .btn.ghost{color:var(--snow-dim)}
:is(.sec,.talk) .btn.sm:hover,:is(.sec,.talk) .btn.ghost:hover{filter:none;color:var(--snow)}
.lines{list-style:none;margin:0;padding:0;display:grid}
.lines li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--snow-line);font-size:17px}
.lines li span{overflow-wrap:anywhere;display:flex;gap:12px;align-items:baseline}
.lines li span::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--fire);transform:translateY(-2px)}
.lines li button{border:0;background:transparent;color:var(--snow-dim);opacity:.55;padding:0;font-size:18px;line-height:1}
.lines li button:hover{opacity:1;color:#f0aa9e}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:5px 13px;border-radius:99px;border:1px solid rgba(244,247,251,.28);color:var(--snow)}
.chip button{border:0;background:transparent;padding:0;color:var(--snow-dim);font-size:15px;line-height:1}
.chip button:hover{color:#f0aa9e}
.checks{display:grid}
.checks label{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--snow-line);cursor:pointer;font-size:17px}
.checks input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(244,247,251,.45);margin:0;flex:none;display:grid;place-items:center;cursor:pointer;background:transparent}
.checks input:checked{background:var(--pine);border-color:var(--pine)}
.checks input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.checks label.on span{color:var(--snow-dim)}
.prog{font-size:14px;color:var(--snow-dim)}

/* day tasks */
.tasks{display:grid}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--snow-line)}
.task input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(244,247,251,.45);margin:1px 0 0;display:grid;place-items:center;cursor:pointer;background:transparent}
.task input:checked{background:var(--pine);border-color:var(--pine)}
.task input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.task label{display:grid;gap:3px;cursor:pointer;min-width:0}
.task .tt{font-family:var(--f);font-size:17px;font-weight:500;line-height:1.35}
.task .ts{font-size:14px;color:var(--snow-dim);line-height:1.45}
.task.on .tt{color:var(--snow-dim);text-decoration:line-through;text-decoration-color:rgba(180,194,216,.45)}
.task .go{border:0;background:none;padding:2px 0;color:var(--fire);font-size:14px;font-weight:700;white-space:nowrap;text-decoration:none;cursor:pointer}
.task .go:hover{color:var(--snow)}
.task .wait{font-size:14px;color:var(--snow-dim);white-space:nowrap;padding-top:3px}
@media (max-width:560px){ .task{grid-template-columns:auto minmax(0,1fr)} .task .go,.task .wait{grid-column:2;justify-self:start;white-space:normal} }
.sec{scroll-margin-top:20px}
.lesson{scroll-margin-top:20px}
.plan{display:grid}
.pl{all:unset;cursor:pointer;display:grid;grid-template-columns:72px minmax(0,1fr);gap:2px 16px;padding:14px 0;border-bottom:1px solid var(--snow-line)}
.pl:focus-visible{outline:2px solid var(--fire)}
.pl .pd{grid-row:span 2;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fire);padding-top:4px}
.pl .pn{font-size:18px}
.pl .pn em{font-style:normal;color:var(--snow-dim);font-size:14px;margin-left:6px}
.pl .pt{font-size:14px;color:var(--snow-dim)}
.pl:hover .pn{color:var(--fire)}
.pl.now .pn{color:var(--fire)}
.stop .pr{font-size:12px;color:var(--snow-dim);font-variant-numeric:tabular-nums}

/* calendar of the hike */
.calw{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;padding-top:12px}
@media (max-width:760px){ .calw{display:flex;overflow-x:auto;scrollbar-width:none;padding:14px 6px 18px} .calw::-webkit-scrollbar{display:none} .calw .cd{flex:0 0 138px} }
.cd{all:unset;box-sizing:border-box;cursor:pointer;position:relative;isolation:isolate;display:grid;justify-items:center;text-align:center;border-radius:6px 6px 4px 4px;color:#2b2620;padding-bottom:18px;margin-bottom:8px;
  background-color:#f4e3e3;
  background-image:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(120,88,48,.28) 100%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .2  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 0 0 1px rgba(90,64,34,.25),0 12px 22px -12px rgba(0,0,0,.7);
  transform:rotate(-1deg);transition:transform .25s ease}
.cd:nth-child(even){transform:rotate(.9deg)}
.cd:nth-child(3n){transform:rotate(-.4deg)}
.cd::before,.cd::after{content:"";position:absolute;left:3px;right:3px;bottom:-4px;height:100%;border-radius:4px;background:#e8d2d3;box-shadow:0 0 0 1px rgba(90,64,34,.2);z-index:-1}
.cd::after{left:6px;right:6px;bottom:-8px;background:#dcc2c4;z-index:-2}
.cd:hover{transform:rotate(0) translateY(-4px)}
.cd:focus-visible{outline:2px solid var(--fire);outline-offset:4px}
.cd .top{justify-self:stretch;background-color:#b4566c;color:#fbecee;border-radius:6px 6px 0 0;padding:16px 8px 9px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;position:relative;background-image:linear-gradient(rgba(255,255,255,.06),rgba(0,0,0,.12))}
.cd .top::after{content:"";position:absolute;left:6px;right:6px;bottom:-5px;height:6px;background:radial-gradient(circle at 3px 3px,#d4b3b6 1.6px,transparent 2px) 0 0/9px 6px repeat-x}
.cd .rings{position:absolute;top:-8px;left:0;right:0;display:flex;justify-content:center;gap:38px}
.cd .rings i{width:8px;height:17px;border-radius:5px;background:linear-gradient(90deg,#6e7480,#e3e7ee 45%,#8a909b);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.cd .num{font-size:58px;line-height:1;font-weight:300;margin-top:16px;letter-spacing:-.04em;color:#231f1a}
.cd .ic{color:#b4566c;margin-top:6px;display:grid}
.cd .ic svg{width:22px;height:22px}
.cd .nm{font-size:17px;margin-top:8px;font-weight:600;color:#231f1a}
.cd .tg{font-size:12.5px;color:#6e5558;padding:3px 10px 0;line-height:1.35}
.cd .pr{margin-top:12px;font-size:12px;color:#7f6467;font-variant-numeric:tabular-nums;border-top:1px dashed rgba(90,64,34,.3);padding-top:8px;justify-self:stretch;margin-inline:14px}
.cd.now{transform:rotate(0) translateY(-6px)}
.cd.now .top{background-color:#e58fa1}
.cd .stamp{position:absolute;right:-8px;top:30px;transform:rotate(9deg);border:2px solid currentColor;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#f8eaeb;box-shadow:0 2px 4px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
.cd .stamp.here{color:#c24f6a}
.cd .stamp.ok{color:#2f6b4f}

/* phone-style hike calendar */
.cv-sec{display:grid;gap:14px;padding:6px 0 10px}
.cv-title{justify-self:center;margin:0;font-family:var(--mono);font-weight:600;text-transform:uppercase;font-size:14px;letter-spacing:.06em;color:#23262d;background:var(--yellow);padding:4px 12px}
.cv-app{width:100%;max-width:640px;margin:0 auto;border-radius:22px;background:var(--beige);color:#23262d;box-shadow:0 26px 44px -24px rgba(0,0,0,.9);overflow:hidden}
.cv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 22px 8px}
.cv-top b{font-weight:500;font-size:22px;letter-spacing:-.01em}
.cv-top b i{font-style:normal;color:var(--rose-deep)}
.cv-top b{font-family:var(--mono);font-weight:600;text-transform:uppercase;font-size:19px!important}
.cv-top span{font-family:"Caveat",cursive;font-size:23px;color:var(--rose-deep)}
.cv-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:4px 10px 0;text-align:center}
.cv-wd{font-size:12px;font-weight:700;color:#8a8d95;padding-bottom:6px}
.cv-day{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:2px 0 8px}
.cv-day:focus-visible .dn{outline:2px solid #b4566c;outline-offset:2px}
.cv-day .dn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-variant-numeric:tabular-nums}
.cv-day .lb{font-family:var(--mono);font-size:11px;color:#8a7f69;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}

.cv-day.on .lb{color:#23262d;font-weight:600}
.cv-day.done .lb{color:var(--olive)}
.cv-day.off{cursor:default;color:#c2c4ca}
.cv-day:not(.off):hover .dn{background:#f1ece3}
.cv-day.on .dn{background:#23262d;color:#fff}
.cv-day.today:not(.on) .dn{box-shadow:inset 0 0 0 2px var(--rose)}
.cv-head{text-align:center;font-family:var(--mono);font-weight:600;text-transform:uppercase;font-size:22px;letter-spacing:-.01em;padding:8px 16px 14px;border-bottom:1px solid #e3ded4}
.cv-head small{display:block;font-family:var(--f);font-weight:400;text-transform:none;letter-spacing:0;font-size:15px;color:#7a7264;margin-top:4px}
.cv-view{position:relative;padding:16px 18px 20px;background:repeating-linear-gradient(180deg,transparent 0 63px,#ece7dd 63px 64px)}
.cv-ev{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:10px;position:relative;z-index:1}
.cv-ev input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:1.6px solid #a99d84;margin:0;display:grid;place-items:center;cursor:pointer;background:#fff8ea}
.cv-ev input:checked{background:var(--olive);border-color:var(--olive)}
.cv-ev input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.cv-ev .b{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cv-ev label{display:grid;gap:2px;cursor:pointer;min-width:0}
.cv-act{border:0;background:none;padding:0;color:var(--rose-deep);font-size:13px;font-weight:700;white-space:nowrap;text-decoration:none;cursor:pointer;font-family:var(--f)}
.cv-act:hover{color:#23262d}
.cv-wait{font-size:12px;color:#9a8f78;white-space:nowrap}
.cv-prog{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;background:var(--yellow);color:#23262d;padding:2px 8px}
@media (max-width:520px){ .cv-ev .b{flex-direction:column;align-items:flex-start;gap:6px} .cv-wait,.cv-act{white-space:normal} }
.cv-ev .b{background:#f6efc6;border-left:4px solid #b9a62a;border-radius:8px;padding:10px 14px}
.cv-ev .b b{display:block;font-weight:600;color:#4d4612;font-size:15px;line-height:1.3;overflow-wrap:break-word;hyphens:auto}
.cv-ev .b{min-width:0;overflow:hidden}
.cv-ev .b span{font-size:12.5px;color:#76703f}

.cv-ev.pink .b b{color:#8a2f61}
.cv-ev.ok .b{background:#e2ebd1;border-left-color:var(--olive)}
.cv-ev.ok .b b{color:#5a6b3a;text-decoration:line-through;text-decoration-color:rgba(111,140,62,.55)}
.cv-ev.ok .b span{color:#5f7a30}
.cv-col{position:absolute;z-index:2;pointer-events:none}
.cv-pol{margin:0;top:18px;right:14px;width:34%;background:#fff;padding:7px 7px 0;box-shadow:0 10px 20px rgba(40,30,20,.3);transform:rotate(5deg)}
.cv-pol img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.cv-pol figcaption{font-family:"Caveat",cursive;font-size:20px;text-align:center;padding:2px 0 6px;color:#3b2f2a}
.cv-clip{top:6px;right:30px;width:12px;height:36px;border:2px solid #8a8f99;border-radius:8px}
.cv-note{right:18px;bottom:64px;font-family:"Caveat",cursive;font-size:24px;line-height:1.05;color:#2c2f36;transform:rotate(-6deg);text-align:right}
/*unused*/.cv-tag{left:48px;bottom:14px;font-family:"Caveat",cursive;font-weight:700;font-size:22px;background:var(--rose);color:#8a2f61;padding:0 10px;border-radius:6px;transform:rotate(-8deg);box-shadow:0 2px 4px rgba(0,0,0,.15)}
.cv-foot{display:flex;justify-content:center;padding:12px 16px 18px;border-top:1px solid #e3ded4}
.cv-foot span{font-family:"Caveat",cursive;font-size:21px;color:var(--rose-deep)}
.cv-go{border:0;background:#23262d;color:#fff;border-radius:99px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer}
.cv-go:hover{background:var(--rose-deep)}
@media (max-width:480px){ .cv-app{border-radius:22px;box-shadow:0 0 0 5px #1a2742,0 22px 36px -20px rgba(0,0,0,.9)} .cv-top span{display:none} .cv-day .dn{width:36px;height:36px;font-size:16px} .cv-pol{width:35%;right:8px} .cv-clip{right:18px} .cv-note{font-size:20px} .cv-pol figcaption{font-size:16px} .cv-top b{font-size:19px} }

/* campfire live reminder */

.live-ic{width:58px;height:58px;border-radius:50%;background:var(--yellow);color:#23262d;display:grid;place-items:center}

.cv-ev.fire .b{background:#fde3cf;border-left-color:#e2733a}

/* lesson notes */
.tips{border-radius:22px;padding:28px 30px;background-color:var(--beige);color:#23262d;box-shadow:0 22px 36px -22px rgba(0,0,0,.85);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .26  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* letter to the future */

  background-color:#f3ecdc;background-image:linear-gradient(90deg,transparent 46px,rgba(200,80,110,.45) 46px 47.5px,transparent 47.5px),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .26  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

function snowfall(){
  const c=$('#snow'), x=c.getContext&&c.getContext('2d'); if(!x) return;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w=0,h=0,fl=[];
  function size(){ const r=c.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1); w=r.width; h=r.height; c.width=w*dpr; c.height=h*dpr; x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(w*h/9000); fl=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,r:.6+Math.random()*1.8,s:.25+Math.random()*.7,d:Math.random()*6.28})); }
  function draw(){ x.clearRect(0,0,w,h); x.fillStyle='rgba(255,255,255,.85)'; fl.forEach(f=>{ x.globalAlpha=.35+f.r/4; x.beginPath(); x.arc(f.x,f.y,f.r,0,6.29); x.fill(); }); x.globalAlpha=1; }
  function tick(){ fl.forEach(f=>{ f.y+=f.s; f.d+=.01; f.x+=Math.sin(f.d)*.3; if(f.y>h+4){ f.y=-4; f.x=Math.random()*w; } }); draw(); if(!document.hidden) raf=requestAnimationFrame(tick); else raf=0; }
  let raf=0; size(); window.addEventListener('resize',size);
  if(reduce){ draw(); return; }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!raf) raf=requestAnimationFrame(tick); });
  raf=requestAnimationFrame(tick);
}

function shrink(file,max){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*sc)||1; c.height=Math.round(im.naturalHeight*sc)||1; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.82)); };
  im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('img')); }; im.src=u; }); }

async function addImages(files,target){

}

  if(t.id==='filePick'){ addImages(t.files,pickFor); t.value=''; return; }
  if(t.dataset.check){ const o=getP(t.dataset.check); o[t.dataset.i]=t.checked; persist(); render(); return; }
  if(t.id==='dayDone'){ D.done[S.day]=t.checked; persist(); render(); if(t.checked) toast(S.day===4?'Добро пожаловать к костру':'Остановка пройдена. Идём дальше'); return; }
  if(t.dataset.b==='d3.final'){ render(); }
});
document.addEventListener('submit',e=>{
  const f=e.target; e.preventDefault();
  if(f.dataset.addlist){ const inp=f.querySelector('input'), v=(inp.value||'').trim(); if(!v) return; const arr=getP(f.dataset.addlist);
    (f.dataset.split?v.split(','):[v]).map(x=>x.trim()).filter(Boolean).forEach(x=>{ if(!arr.includes(x)) arr.push(x); });
    persist(); render(); const again=document.querySelector('[data-addlist="'+f.dataset.addlist+'"] input'); if(again) again.focus(); }
  else if(f.id==='colorForm'){ D.dna.colors.push({hex:$('#colorIn').value,name:($('#colorName').value||'').trim()}); persist(); render(); }
  else if(f.id==='refForm'){ const v=($('#refIn').value||'').trim(); if(!v) return; const r={id:uid('r'),img:'',title:'',url:''};
    if(looksUrl(v)) r.url=/^https?:\/\//i.test(v)?v:'https://'+v; else r.title=v; D.d1.refs.unshift(r); persist(); render(); toast('Референс добавлен'); }
});
document.addEventListener('paste',e=>{
  const items=[...((e.clipboardData&&e.clipboardData.items)||[])].filter(i=>i.type&&i.type.startsWith('image/')); if(!items.length) return;
  const target=S.day===0?'me':(S.day===1?'refs':null); if(!target) return;
  e.preventDefault(); addImages(items.map(i=>i.getAsFile()),target);
});
document.addEventListener('dragover',e=>{ const d=e.target.closest&&e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave',e=>{ const d=e.target.closest&&e.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop',e=>{ const d=e.target.closest&&e.target.closest('#drop'); if(!d) return; e.preventDefault(); d.classList.remove('over'); addImages(e.dataTransfer.files,'me'); });

async function bkCopy(){
  const txt=JSON.stringify({app:APP,v:1,data:D}), ta=$('#bkCopyText'); $('#bkRestoreBox').hidden=true; let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){}
  if(ok){ ta.hidden=true; toast('Копия скопирована. Сохрани её в заметки'); } else { ta.value=txt; ta.hidden=false; ta.focus(); ta.select(); toast('Выдели текст и скопируй его'); }
}
function bkRestore(){
  const er=$('#bkErr'), raw=($('#bkRestoreText').value||'').trim(), fail=m=>{ er.hidden=false; er.textContent=m; };
  if(!raw) return fail('Сначала вставь копию.');
  let p=null; try{ p=JSON.parse(raw); }catch(e){ return fail('Это не похоже на копию. Скопируй текст целиком.'); }
  if(!p||p.app!==APP||!p.data) return fail('Это не копия этой страницы.');
  D=merge(p.data); persist(); $('#bkRestoreText').value=''; $('#bkRestoreBox').hidden=true; go(0); toast('Всё восстановлено');
}

function autosize(el){ const empty=!el.value&&el.placeholder; el.style.height='auto'; if(empty){ el.value=el.placeholder; el.style.fontSize=getComputedStyle(el,'::placeholder').fontSize; el.style.fontStyle='italic'; } const h=el.scrollHeight; if(empty){ el.value=''; el.style.fontSize=''; el.style.fontStyle=''; } el.style.height=(h+2)+'px'; }
document.addEventListener('input',e=>{ if(e.target.matches&&e.target.matches('.f textarea')) autosize(e.target); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.matches&&e.target.matches('textarea.one')) e.preventDefault(); });
new MutationObserver(()=>document.querySelectorAll('#day .f textarea').forEach(autosize)).observe(document.getElementById('day'),{childList:true});
window.addEventListener('resize',()=>document.querySelectorAll('#day .f textarea').forEach(autosize));
load(); fromHash(); snowfall();
if(S.storeErr==='blocked') toast('Этот браузер не сохраняет записи. Открой ссылку в обычном окне, не в инкогнито');
})();
</script>
